name: Publish site

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/source'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download theme
        env:
          THEME_COMMIT: "a6bc1e09a12ff2b3f087b4bed0bc7825b1b6e87a"
        run: |
          git clone https://github.com/halogenica/beautifulhugo ./themes/beautifulhugo
          git -C ./themes/beautifulhugo checkout --detach "$THEME_COMMIT"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'

      - name: Build site
        run: |
          rm -rf public
          hugo --theme beautifulhugo --buildDrafts=false

      - name: Publish to master
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GIT_TOKEN }}
          publish_dir: ./public
          publish_branch: master
          cname: esaezgil.com
