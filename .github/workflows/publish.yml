name: Publish site

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/source'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download custom theme
        run: git clone https://github.com/esaezgil/beautifulhugo ./themes/beautifulhugo_custom

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.55.5'

      - name: Build site
        run: |
          rm -rf public
          hugo --theme beautifulhugo_custom --buildDrafts=false

      - name: Publish to master
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GIT_TOKEN }}
          publish_dir: ./public
          publish_branch: master
          cname: esaezgil.com
