baseurl = "https://esaezgil.com/"
title = "Enrique Saez"
locale = "en-US"
defaultContentLanguage = "en"
theme = "beautifulhugo"

CanonifyUrls = true
relativeURLs = true

enableRobotsTXT = true

[Params]
  hideAuthor = true
  toc = false
  showPostNav = false
  description = "Enrique Saez Gil personal blog - python, software, books, open source, events"
  subtitle = "Software & Telecom engineer - ICT enthusiast"
  logo = "img/icon.jpg"
  comments = true
  colorScheme = "light"

[[menu.main]]
    name = "Blog"
    url = "/"
    weight = 2

[[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2

[[menu.main]]
    identifier = "events"
    name = "Events"
    weight = 2

[[menu.main]]
    parent = "events"
    name = "Hackathons"
    url = "/events/"
    weight = 1

[[menu.main]]
    parent = "events"
    name = "Talks"
    url = "/talks/"
    weight = 2

[[menu.main]]
    parent = "events"
    name = "Meetups & Conferences"
    url = "/meetups/"
    weight = 3

[[menu.main]]
    identifier = "more"
    name = "More"
    weight = 2

[[menu.main]]
    parent = "more"
    name = "Books"
    url = "/books/"
    weight = 2

[[menu.main]]
    parent = "more"
    name = "Now"
    url = "/now/"
    weight = 2

[[menu.main]]
    parent = "more"
    name = "Reviews"
    url = "/reviews/"
    weight = 2

[[menu.main]]
    parent = "more"
    name = "Links"
    url = "/interesting_links/"
    weight = 3

[[menu.main]]
    parent = "more"
    name = "Search"
    url = "/search/"
    weight = 4

[Params.author]
  name = "Enrique Saez Gil"
  github = "esaezgil"
  twitter = "eqirn"
  linkedin = "enriquesaezgil/en"
  stackoverflow = "/users/4378118/enrique-saez/"
  keybase = "esaezgil"
  speakerdeck = "esaezgil"
  meetup = "212721897"

[related]

# Only include matches with rank >= threshold. This is a normalized rank between 0 and 100.
threshold = 10

# To get stable "See also" sections we, by default, exclude newer related pages.
includeNewer = true

# Will lower case keywords in both queries and in the indexes.
toLower = false

[[related.indices]]
name = "keywords"
weight = 150
[[related.indices]]
name  = "author"
toLower = true
weight = 30
[[related.indices]]
name  = "tags"
weight = 100
[[related.indices]]
name  = "date"
weight = 10
pattern = "2006"

[outputs]
  home = ["HTML", "JSON"]

[services.disqus]
  shortname = "esaezgil"
[markup.goldmark.renderer]
  unsafe = true
[markup.highlight]
  style = "manni"
  noClasses = false
[Params.search]
  provider = "fuse"
